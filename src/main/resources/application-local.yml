server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${SPRING_MAIL_HOST}
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.vectorstore.chroma.ChromaVectorStoreAutoConfiguration
      - org.springframework.ai.autoconfigure.ollama.OllamaAutoConfiguration
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

app:
  ai:
    chat:
      provider: ${AI_CHAT_PROVIDER:gemini}
      gemini:
        api-key: ${GEMINI_API_KEY:}
        model: ${GEMINI_MODEL:gemini-2.5-flash}
        temperature: 0.7
        base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      ollama:
        base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
        model: ${OLLAMA_CHAT_MODEL:llama3:8b}
        temperature: 0.7
    embedding:
      provider: ${AI_EMBEDDING_PROVIDER:ollama}
      ollama:
        base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
        model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
      gemini:
        api-key: ${GEMINI_API_KEY:}
        model: ${GEMINI_EMBED_MODEL:text-embedding-004}
        base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    vector-store:
      chroma:
        host: ${CHROMA_HOST:http://localhost}
        port: ${CHROMA_PORT:8000}
        collection-name: ecommerce_products
