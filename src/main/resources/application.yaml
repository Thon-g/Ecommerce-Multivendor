server:
  port: 8080

spring:
  application:
    name: Ecommerce-Multivendor
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce-db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      show-sql: true
      hibernate:
        ddl-auto: update
