name: CI Pipeline

# Kích hoạt pipeline khi có người push code lên nhánh dev hoặc main
on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # Cấp phát một máy ảo Ubuntu

    steps:
    - name: Tải Source Code
      uses: actions/checkout@v4

    - name: Cài đặt Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven # Giúp các lần build sau nhanh hơn

    - name: Build dự án với Maven
      # Tạm thời bỏ qua Test để tránh lỗi do thiếu kết nối Database trên máy ảo
      run: mvn clean package -DskipTests